<style>
  .signature-path {
    /* The dasharray matches the approximate length of your path */
    stroke-dasharray: 3500; 
    stroke-dashoffset: 3500;
    animation: write-signature 8s ease-in-out forwards infinite;
    stroke: #fdfdfd;
  }

  @keyframes write-signature {
    0% {
      stroke-dashoffset: 3500;
    }
    40% {
      stroke-dashoffset: 0;
    }
    80% {
      stroke-dashoffset: 0;
      opacity: 1;
    }
    100% {
      stroke-dashoffset: 0;
      opacity: 0;
    }
  }

  /* Accessibility: Disable animation if user prefers reduced motion */
  @media (prefers-reduced-motion) {
    .signature-path {
      animation: none;
      stroke-dashoffset: 0;
    }
  }
</style>

